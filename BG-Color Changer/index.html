<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG-Color Changer</title>
    <link rel="stylesheet" href="bg-style.css">
</head>
<body>
    <section class="hero">
        <h1>BackGround Color Changer</h1>
        <img src="color-icon.avif" width="300px" alt="color-icon">
        <p>Click on the below circle to change the background color.</p>

        <div class="container">
            <div class="box" id="red">Red</div>
            <div class="box" id="blue">Blue</div>
            <div class="box" id="green">Green</div>
            <div class="box" id="yellow">Yellow</div>
            <div class="box" id="pink">Pink</div>
        </div>
    </section>
    <script src="index.js"></script>
</body>
</html>
