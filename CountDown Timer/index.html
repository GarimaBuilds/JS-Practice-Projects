<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountDown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="main">
        <div class="logo">
            <img src="baYs9AuHxx9QXeYBiMvSLU.jpg" alt="NASA_logo">
        </div>
        <h1>
            MISSION LAUNCHING ON
        </h1>

        <div class="col">
            <div class="input">
                <input type="text" value="18" readonly>
                <label for="">Days</label>
            </div>
            <span class="colon">:</span>

            <div class="input">
                <input type="text" value="14" readonly>
                <label for="">Hours</label>
            </div>
            <span class="colon">:</span>

            <div class="input">
                <input type="text" value="10" readonly>
                <label for="">Minutes</label>
            </div>
            <span class="colon">:</span>

            <div class="input">
                <input type="text" value="06" readonly>
                <label for="">Seconds</label>
            </div>
            
        </div>

        <button class="btn">Watch Live Event</button>

    </div>
    <script src="index.js"></script>
</body>
</html>
