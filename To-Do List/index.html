<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <div class="container">
        <div class="todo">
            <h2>To-Do List <img src="todoemoji.png"></h2>
            <div class="input">
                <input type="text" id="input-items" placeholder="Add your task">
                <button onclick="addTask()">Add</button>
            </div>
        </div>
    </div>
    <script src="todo.js"></script>
</body>
</html>
